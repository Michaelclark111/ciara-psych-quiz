name: Assemble quiz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode index.html from base64 parts
        run: |
          cat b64/p00.txt b64/p01.txt b64/p02.txt b64/p03.txt b64/p04.txt b64/p05.txt b64/p06.txt b64/p07.txt b64/p08.txt b64/p09.txt | tr -d '\n' | base64 -d > index.html
          wc -c index.html
          python3 -c "import hashlib; print(hashlib.sha256(open('index.html','rb').read()).hexdigest())"
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Assemble psych nursing hard practice quiz"
          git push
